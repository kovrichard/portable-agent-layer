version: 2
updates: 
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "canary"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@hughescr/stryker-bun-runner"
      - dependency-name: "@stryker-mutator/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "promptfoo"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "canary"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

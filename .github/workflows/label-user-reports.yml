name: label-user-reports

# GitHub drops labels that a user without push access sets, so an issue or a pull
# request sent by `pal cli report send` from a user's machine arrives unlabelled.
# Its body ends with the visible line `pal cli report` writes; this labels it.
# pull_request_target runs with this repository's token, so it never checks out
# the pull request's code.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Label reports drafted by pal cli report
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          KIND: ${{ github.event_name == 'pull_request_target' && 'pr' || 'issue' }}
        run: |
          if printf '%s' "$BODY" | grep -qF 'Drafted by `pal cli report`'; then
            gh "$KIND" edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label user-report
          fi

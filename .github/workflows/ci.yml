name: ci

on:
  pull_request:
    branches:
      - main
      - canary
  push:
    branches:
      - main
      - canary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # Skip the heavy Chromium download in CI (~150MB) — only the consulting-report
      # / create-pdf skills use Playwright at runtime, not the test suite.
      PAL_SKIP_BROWSER_INSTALL: "1"
      # Skip the doctor pre-flight prompt in `pal cli init`.
      PAL_SKIP_DOCTOR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Cache Bun packages
        # Windows only: installing takes 60-120 s there and under 20 s elsewhere.
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        # No lifecycle scripts, so no dependency can run arbitrary code on install.
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache

      - name: Audit dependencies
        # Informational only — bun audit lacks a --production flag, and all
        # current advisories are in dev-only deps (semantic-release, knip,
        # lint-staged) that never ship to users. Flip to blocking once bun
        # supports prod-only filtering.
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Measure process start cost
        shell: bash
        run: |
          mkdir -p .test
          cat > .test/spawn-probe.ts <<'EOF'
          import { spawnSync } from "node:child_process";
          import { mkdirSync } from "node:fs";
          import { availableParallelism, totalmem } from "node:os";
          import { resolve } from "node:path";
          import { spawnTool } from "../assets/plugins/dark-factory/scripts/lib.mjs";
          import { writeFakeBin } from "../test/fixtures/fake-bin";

          const RUNS = 15;
          const bin = resolve(".test/probe-bin");
          mkdirSync(bin, { recursive: true });
          writeFakeBin(bin, "fake", "console.log('ok');\n");
          const env = { ...process.env, PATH: `${bin}${process.platform === "win32" ? ";" : ":"}${process.env.PATH}` };

          const cases: Record<string, () => unknown> = {
            "git --version": () => spawnSync("git", ["--version"]),
            "git status": () => spawnSync("git", ["status", "--porcelain"]),
            "bun -e 0": () => spawnSync(process.execPath, ["-e", "0"]),
            "bun run fake.ts": () => spawnSync(process.execPath, ["run", resolve(bin, "fake.ts")]),
            "fake CLI via shim": () => spawnTool("fake", [], { env }),
            "sh -c true": () => spawnSync("sh", ["-c", "true"]),
          };

          console.log(`${process.platform}, ${availableParallelism()} CPUs, ${Math.round(totalmem() / 2 ** 30)} GB`);
          for (const [name, run] of Object.entries(cases)) {
            run();
            const ms = Array.from({ length: RUNS }, () => {
              const start = performance.now();
              run();
              return performance.now() - start;
            }).sort((a, b) => a - b);
            console.log(`${name.padEnd(20)} median ${ms[RUNS >> 1].toFixed(0).padStart(5)} ms   max ${ms[RUNS - 1].toFixed(0).padStart(5)} ms`);
          }
          EOF
          bun .test/spawn-probe.ts

      - name: Profile one factory run alone
        shell: bash
        run: |
          mkdir -p .test/trace2
          cat > .test/trace-sum.ts <<'EOF'
          import { readdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";

          const dir = process.argv[2] as string;
          const byCommand = new Map<string, { count: number; seconds: number }>();
          for (const file of readdirSync(dir)) {
            let name = "?";
            let seconds = 0;
            for (const line of readFileSync(join(dir, file), "utf8").split("\n").filter(Boolean)) {
              const event = JSON.parse(line);
              if (event.event === "start" && name === "?") name = `git ${event.argv?.[1] ?? ""}`.replace(/^git \S*[\\/]/, "git ");
              if (event.event === "atexit" || event.event === "exit") seconds = Math.max(seconds, event.t_abs ?? 0);
            }
            const entry = byCommand.get(name) ?? { count: 0, seconds: 0 };
            byCommand.set(name, { count: entry.count + 1, seconds: entry.seconds + seconds });
          }
          const rows = [...byCommand].sort((a, b) => b[1].seconds - a[1].seconds);
          const total = rows.reduce((sum, [, e]) => sum + e.seconds, 0);
          const count = rows.reduce((sum, [, e]) => sum + e.count, 0);
          console.log(`git: ${count} processes, ${total.toFixed(2)} s inside git`);
          for (const [name, e] of rows.slice(0, 12))
            console.log(`${name.padEnd(28)} ${String(e.count).padStart(4)}x ${e.seconds.toFixed(2).padStart(7)} s`);
          EOF
          GIT_TRACE2_EVENT="$PWD/.test/trace2" bun test test/dark-factory-build.spawn.test.ts --test-name-pattern "a whole feature run"
          bun .test/trace-sum.ts .test/trace2
          cat > .test/gaps.ts <<'EOF'
          const lines = require("fs").readFileSync(process.argv[2], "utf8").split("\n").filter(Boolean).map((l: string) => JSON.parse(l));
          let prev = Date.parse(lines[0].ts);
          for (const e of lines) {
            const t = Date.parse(e.ts);
            console.log(`${String(t - prev).padStart(6)} ms  ${e.event}${e.role ? ":" + e.role : ""}`);
            prev = t;
          }
          EOF
          bun .test/gaps.ts .test/dark-factory-build.spawn/tmp/1/factory/events.jsonl

      - name: Gates and fast tests
        shell: bash
        run: LINT_STAGE=commit bun run gates

      - name: Spawn tests
        run: bun run test --spawn --only-failures ${{ runner.os == 'Windows' && '--parallel=4' || '' }}

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.os }}
          path: .test/test-report.xml
          if-no-files-found: ignore

  browser-smoke:
    # Windows only, deliberately: chromium.launch hung under Bun on Windows and
    # nowhere else, and the workaround outlived the bug because nothing ever
    # launched a browser in CI. Its own job so the ~150MB Chromium download stays
    # off the three-OS test matrix, which explicitly skips it; this runs in
    # parallel, so it costs no wall-clock time there.
    name: browser-smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      PAL_SKIP_DOCTOR: "1"
      PAL_BROWSER_SMOKE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        # No lifecycle scripts, so no dependency can run arbitrary code on install.
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache

      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bun x playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright

      - name: Launch a browser and capture a screenshot
        run: bun test test/browser-smoke.spawn.test.ts
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright

  doctor-fixes:
    # Breaks a sandboxed install on purpose and runs every fix the doctor prints
    # as PAL's own command, in package and repo mode. Its own job because it
    # packs, installs and reinstalls PAL about forty times.
    name: doctor-fixes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      PAL_FIX_PROOFS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        # No lifecycle scripts, so no dependency can run arbitrary code on install.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run every fix the doctor prints
        run: bun test test/doctor-fixes.spawn.test.ts

  pkg-e2e:
    name: pkg-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      PAL_SKIP_BROWSER_INSTALL: "1"
      PAL_SKIP_DOCTOR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Cache Bun packages
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        # No lifecycle scripts, so no dependency can run arbitrary code on install.
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache

      - name: Pack tarball
        shell: bash
        run: |
          bun pm pack
          mv portable-agent-layer-*.tgz pal.tgz
          ls -lh pal.tgz

      - name: Install globally from tarball
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bun-global"
          echo "BUN_INSTALL=$RUNNER_TEMP/bun-global" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/bun-global/bin" >> "$GITHUB_PATH"
          BUN_INSTALL="$RUNNER_TEMP/bun-global" bun add -g "$(pwd)/pal.tgz"

      - name: Status reports version
        shell: bash
        env:
          PAL_HOME: ${{ runner.temp }}/pal-home
        run: |
          mkdir -p "$PAL_HOME"
          out=$(pal cli status)
          echo "$out"
          echo "$out" | grep -q "Version:"

      - name: Init wires Claude target
        shell: bash
        env:
          PAL_HOME: ${{ runner.temp }}/pal-home
          PAL_CLAUDE_DIR: ${{ runner.temp }}/pal-home/.claude
          PAL_OPENCODE_DIR: ${{ runner.temp }}/pal-home/.opencode
          PAL_CURSOR_DIR: ${{ runner.temp }}/pal-home/.cursor
          PAL_AGENTS_DIR: ${{ runner.temp }}/pal-home/.agents
        run: |
          pal cli init --claude
          test -d "$PAL_HOME/telos"
          test -f "$PAL_CLAUDE_DIR/settings.json"

      - name: Update is no-op on freshly-installed latest
        shell: bash
        env:
          PAL_HOME: ${{ runner.temp }}/pal-home
        run: |
          out=$(pal cli update || true)
          echo "$out"
          echo "$out" | grep -qE "(Already up to date|Updated:)"

  release:
    needs: [test, pkg-e2e, browser-smoke, doctor-fixes]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        # No lifecycle scripts, so no dependency can run arbitrary code on install.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

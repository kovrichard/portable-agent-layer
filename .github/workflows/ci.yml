name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # Skip the heavy Chromium download in CI (~150MB) — only the consulting-report
      # / create-pdf skills use Playwright at runtime, not the test suite.
      PAL_SKIP_BROWSER_INSTALL: "1"
      # Skip the doctor pre-flight prompt in `pal cli init`.
      PAL_SKIP_DOCTOR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        # Informational only — bun audit lacks a --production flag, and all
        # current advisories are in dev-only deps (semantic-release, knip,
        # lint-staged) that never ship to users. Flip to blocking once bun
        # supports prod-only filtering.
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Check (lint + format)
        run: bun run check

      - name: Type-check
        run: bun run type-check

      - name: Knip
        run: bun run knip

      - name: jscpd
        run: bun run jscpd

      - name: Klint
        run: bun run klint

      - name: Madge
        run: bun run madge

      - name: Line endings
        run: bun run lf

      - name: Secretlint
        run: bun run secretlint

      - name: Test
        run: bun run test

  pkg-e2e:
    name: pkg-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      PAL_SKIP_BROWSER_INSTALL: "1"
      PAL_SKIP_DOCTOR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack tarball
        shell: bash
        run: |
          bun pm pack
          mv portable-agent-layer-*.tgz pal.tgz
          ls -lh pal.tgz

      - name: Install globally from tarball
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bun-global"
          echo "BUN_INSTALL=$RUNNER_TEMP/bun-global" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/bun-global/bin" >> "$GITHUB_PATH"
          BUN_INSTALL="$RUNNER_TEMP/bun-global" bun add -g "$(pwd)/pal.tgz"

      - name: Status reports version
        shell: bash
        env:
          PAL_HOME: ${{ runner.temp }}/pal-home
        run: |
          mkdir -p "$PAL_HOME"
          out=$(pal cli status)
          echo "$out"
          echo "$out" | grep -q "Version:"

      - name: Init wires Claude target
        shell: bash
        env:
          PAL_HOME: ${{ runner.temp }}/pal-home
          PAL_CLAUDE_DIR: ${{ runner.temp }}/pal-home/.claude
          PAL_OPENCODE_DIR: ${{ runner.temp }}/pal-home/.opencode
          PAL_CURSOR_DIR: ${{ runner.temp }}/pal-home/.cursor
          PAL_AGENTS_DIR: ${{ runner.temp }}/pal-home/.agents
        run: |
          pal cli init --claude
          test -d "$PAL_HOME/telos"
          test -f "$PAL_CLAUDE_DIR/settings.json"

      - name: Update is no-op on freshly-installed latest
        shell: bash
        env:
          PAL_HOME: ${{ runner.temp }}/pal-home
        run: |
          out=$(pal cli update || true)
          echo "$out"
          echo "$out" | grep -qE "(Already up to date|Updated:)"

  release:
    needs: [test, pkg-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # Skip the heavy Chromium download in CI (~150MB) — only the consulting-report
      # / create-pdf skills use Playwright at runtime, not the test suite.
      PAL_SKIP_BROWSER_INSTALL: "1"
      # Skip the doctor pre-flight prompt in `pal cli init`.
      PAL_SKIP_DOCTOR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (lint + format)
        run: bun run check

      - name: Type-check
        run: bun run type-check

      - name: Knip
        run: bun run knip

      - name: Test
        run: bun run test

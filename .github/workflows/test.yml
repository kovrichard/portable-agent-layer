name: test

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Bun.js
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install

    - name: Lint
      run: bun run check

    - name: Type check
      run: bun run type-check

    - name: Test
      run: bun run test

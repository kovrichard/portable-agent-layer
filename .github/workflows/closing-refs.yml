name: closing-refs

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - canary

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closing-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        # No lifecycle scripts, so no dependency can run arbitrary code on install.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Closing keywords point at issues in this repo
        run: bun .agents/scripts/check-closing-refs.ts ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}

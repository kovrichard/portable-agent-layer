name: mutation

on:
  pull_request:
    branches:
      - main
      - canary

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  mutation:
    # Linux only, deliberately: the rest of CI runs a three-OS matrix, but this gate
    # measures test strength, which is platform-independent. Running it three times
    # would triple the slowest job in the repo for no extra signal.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PAL_SKIP_BROWSER_INSTALL: "1"
      PAL_SKIP_DOCTOR: "1"
      STRYKER_CONCURRENCY: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge-base against the PR base branch resolves.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not floated: bun 1.3.14 changed async-promise cleanup in a way that
          # broke the Stryker bun runner, which held this at 1.3.13 until 1.4.0 ran a
          # mutation pass clean again. Re-check with a local `stryker run` before moving it.
          bun-version: "1.4.4"

      - name: Install dependencies
        # No lifecycle scripts, so no dependency can run arbitrary code on install.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Mutation-test the changed lines
        run: bun run test:mutate:diff "origin/${{ github.event.pull_request.base.ref }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation.html
          if-no-files-found: ignore

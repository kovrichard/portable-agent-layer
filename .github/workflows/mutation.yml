name: mutation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  mutation:
    # Linux only, deliberately: the rest of CI runs a three-OS matrix, but this gate
    # measures test strength, which is platform-independent. Running it three times
    # would triple the slowest job in the repo for no extra signal.
    runs-on: ubuntu-latest

    env:
      PAL_SKIP_BROWSER_INSTALL: "1"
      PAL_SKIP_DOCTOR: "1"
      STRYKER_CONCURRENCY: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so the merge-base against the PR base branch resolves.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Hard pin, not a preference: bun 1.3.14 changed async-promise cleanup in a
          # way that breaks the Stryker bun runner. Do not float this to latest.
          bun-version: "1.3.13"

      - name: Install dependencies
        # No lifecycle scripts, so no dependency can run arbitrary code on install.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Mutation-test the changed lines
        run: bun run test:mutate:diff "origin/${{ github.event.pull_request.base.ref }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: reports/mutation.html
          if-no-files-found: ignore

# dark-factory planner plan evaluation
#
# Evaluates the planner agent (assets/plugins/dark-factory/agents/planner.md)
# against the prompt it replaced (baseline-planner.md). Each case is a real
# spec whose built code drew a reviewer finding (spec drift, shared state or
# repeated work), with an excerpt of the code at the task's base commit. A
# plan passes a case when it names the hazard before any code exists. One
# control case, a refactor with neither, catches a prompt that invents work.
#
# Pass bar, written before the first run: in each of 2 repeats, current names
# the hazard in at least 7 of 9 cases and in at least 3 more cases than
# baseline; every current plan has all three sections (criteria map, must not
# add, runtime model); the control plan adds no locking, no once-per-task
# bookkeeping and no runtime-model steps beyond saying the change has no
# shared state.
# Kill: current names fewer hazards than baseline, or the control case gains
# invented work.
#
# Run:
#   bun run eval:planner-plan --repeat 2

description: dark-factory planner — plans name spec drift, shared state and repeated work

prompts:
  - id: file://prompt.js:current
    label: current
  - id: file://prompt.js:baseline
    label: baseline

providers:
  - id: file://../lib/claude-cli.js
    label: opus-5-5
    config: { model: claude-opus-5-5, timeoutMs: 600000 }

defaultTest:
  assert:
    - type: javascript
      value: file://check.js:hazard
      description: Names the case's hazard
    - type: javascript
      value: file://check.js:sections
      description: Has the three sections
    - type: javascript
      value: file://check.js:control
      description: Control adds no invented work

tests:
  - description: coach criterion 9 — any added name, not only distinctive ones
    vars:
      spec: file://cases/coach-learns/spec.md
      code: file://cases/coach-learns/code.md
      hazard:
        - '\bany\b[^\n]{0,60}names?\b[^\n]{0,160}(literal|every|all|even short|even common|not only|not just|narrow)'
        - '(distinctive|short|common|generic)[^\n]{0,40}names?[^\n]{0,160}(question|PO|literal|still)'

  - description: coach — no unrequested start event
    vars:
      spec: file://cases/coach-learns/spec.md
      code: file://cases/coach-learns/code.md
      hazard:
        - '\b(no|not|never|must not|nothing)\b[^\n]{0,80}\bcoach_started\b'
        - '\bcoach_started\b[^\n]{0,80}\b(not|no criterion|unrequested|unasked|not asked)\b'

  - description: coach — no undocumented --add-dir
    vars:
      spec: file://cases/coach-learns/spec.md
      code: file://cases/coach-learns/code.md
      hazard:
        - 'add-dir[^\n]{0,160}(only|not|no |never|document|README|criterion)'
        - '(no|not|never|must not)[^\n]{0,80}(add-dir|extra director|additional director)'

  - description: coach verdict — reviewed count agrees with the missing list
    vars:
      spec: file://cases/coach-verdict/spec.md
      code: file://cases/coach-verdict/code.md
      hazard:
        - 'reviewed[^\n]{0,120}(exclud|minus|not count|never count|only count|except|without)[^\n]{0,80}missing'
        - '(exclud|minus|not count|never count|except|without)[^\n]{0,80}missing[^\n]{0,120}reviewed'
        - 'expected\s*(-|minus)\s*missing'
        - '(same|consistent|agree|match)[^\n]{0,80}(reviewed|expected)[^\n]{0,80}missing (list|inputs|set)'

  - description: PR attach — dedupe per node and PR
    vars:
      spec: file://cases/pr-attach/spec.md
      code: file://cases/pr-attach/code.md
      hazard:
        - '(dedup|duplicate|already attached|key)[^\n]{0,80}(node|nodeId)[^\n]{0,30}(and|\+|plus|/)[^\n]{0,10}(pr|url)\b'
        - '(dedup|duplicate|already attached|key)[^\n]{0,80}(pr|url)[^\n]{0,30}(and|\+|plus|/|per|on)[^\n]{0,10}(node|nodeId)'
        - '(per|same|that|each)[^\n]{0,10}node[^\n]{0,80}(again|already|duplicate|dedup)'
        - '(already|duplicate|dedup)[^\n]{0,80}(on|to|for|in) (that|the same|this) node'

  - description: coach — findings.jsonl written by overlapping runs
    vars:
      spec: file://cases/coach-learns/spec.md
      code: file://cases/coach-learns/code.md
      hazard:
        - '\b(lock|locks|locking|atomic(ally)?|atomic write)\b[^\n]{0,200}findings\.jsonl[^\n]{0,200}\b(overlap\w*|concurren\w*|two runs|simultaneous)\b'
        - 'findings\.jsonl[^\n]{0,200}\b(overlap\w*|concurren\w*|two runs|simultaneous)\b[^\n]{0,200}\b(lock|locks|locking|atomic(ally)?)\b'
        - '\b(overlap\w*|concurren\w*|two runs|simultaneous)\b[^\n]{0,200}\b(lock|locks|locking|atomic(ally)?)\b[^\n]{0,200}findings\.jsonl'
        - '\b(overlap\w*|concurren\w*|two runs|simultaneous)\b[^\n]{0,200}findings\.jsonl[^\n]{0,200}\b(lock|locks|locking|atomic(ally)?)\b'

  - description: coach — approve checks status inside the lock
    vars:
      spec: file://cases/coach-learns/spec.md
      code: file://cases/coach-learns/code.md
      hazard:
        - '\bapprov\w*[^\n]{0,200}\b(status|state)\b[^\n]{0,120}\b(inside|within|under|while holding|after taking)\b[^\n]{0,40}\block\b'
        - '\bapprov\w*[^\n]{0,200}\b(inside|within|under|while holding)\b[^\n]{0,40}\block\b[^\n]{0,120}\b(status|state)\b'
        - '\b(status|state)\b[^\n]{0,120}\b(checked|check|read|re-?read)\b[^\n]{0,60}\b(inside|within|under)\b[^\n]{0,40}\block\b[^\n]{0,200}\bapprov'

  - description: coach — gh pr view once, not on every run
    vars:
      spec: file://cases/coach-learns/spec.md
      code: file://cases/coach-learns/code.md
      hazard:
        - 'gh pr view[^\n]{0,160}(once|cache|every|each|record|remember|grows?)'
        - '(cache|memoi[sz]|remember|record)[^\n]{0,120}(merged|merge state|pr state)'
        - '(merge|pr)[^\n]{0,80}(once per task|only once|grows? with history)'

  - description: instructions — import missing recorded once per task
    vars:
      spec: file://cases/instructions/spec.md
      code: file://cases/instructions/code.md
      hazard:
        - 'instructions_import_missing[^\n]{0,200}(once|already|dedup|per task|first)'
        - '(once per task|only once|already recorded|dedup|first role)[^\n]{0,200}(import|instructions)'

  - description: control — rename 2026-10-19-rename-the-work-tree-to-progress-tree with no shared state or per-call work
    vars:
      spec: file://cases/control-rename/spec.md
      code: file://cases/control-rename/code.md
      control: true

# yaml-language-server: $schema=https://raw.githubusercontent.com/konvert7/klint/refs/heads/main/klint.schema.json

include:
  - src
  - assets
  - "!**/node_modules/**"
  - "!**/.next/**"
  - "!**/out/**"
  - "!**/dist/**"
  - "!**/vendor/**"
plugins: [sonar]
rules:
  no-unguarded-json-parse: error
  no-sync-in-async:
    severity: error
    include: ["src/hooks/**"]
  no-floating-promise: error
  no-misused-promises: error
  no-date-equality: error
  no-optional-chain-on-non-nullable: error
  no-object-in-template: error
  no-nested-template-literals: error
  no-consecutive-array-push: error
  no-string-match: error
  sonar/prefer-string-raw: off

arch:
  layers:
    core: ["src/hooks/lib/**", "src/tools/**"]
    skills: ["assets/skills/**"]
    targets: ["src/targets/**"]
    cli: ["src/cli/**"]

  imports:
    - from: skills
      deny: ["src/**"]
      message: "Skill imports from the repo's src/ directory — skills must be self-contained and portable across machines."
      severity: warn

    - from: core
      deny: targets
      message: "Core library modules must not import agent-specific code — that dependency belongs in src/targets/, not in the shared library."

    - from: core
      deny: cli
      message: "Core library modules must not import from the CLI layer — the CLI depends on core, not the other way around."

  maxCommentDensity:
    - limit: 5
      in: ["src/**", "assets/skills/**"]
      countDocComments: false
      message: "Encode intent in names and small functions, not prose — see the Documenting code rules in AGENTS.md."
      severity: warn

  maxCommentBlock:
    - limit: 2
      in: ["src/**", "assets/skills/**"]
      countDocComments: false
      message: "Extract a well-named function instead of stacking comment lines — see the Documenting code rules in AGENTS.md."
      severity: warn

  # A hook entrypoint is only ever spawned, so it exports nothing and no test can
  # import it — Stryker's instrumentation never sees it run and its logic can be
  # deleted outright with the suite still green (ISC-21). Both rules below hold it
  # to stdin -> parse -> one exported library call -> stdout. Scoped to the
  # entrypoints alone: src/hooks/handlers/** export their entry point, so their
  # private helpers are ordinary encapsulation and are none of this rule's business.
  # Both were severity: warn while ISC-21 emptied the backlog they described.
  # Every entrypoint is under the limit as of 2026-09-06, so they block now.
  maxLines:
    - limit: 90
      in: ["src/hooks/*.ts", "!src/hooks/handlers/**", "!src/hooks/lib/**"]
      message: "Hook entrypoint is too long to be only glue — move the logic to src/hooks/lib/ where a test can import it."

  forbidden:
    - pattern: "process.exit("
      in: ["src/hooks/lib/**"]
      message: "process.exit() called inside a library module — library functions should return or throw, not terminate the process."

    # cmd.exe never expands "~" and PowerShell hands it to native commands
    # literally, so a tilde invocation in a doc comment or a printed next-step
    # hint is a command a Windows user cannot run. This covers only the .ts
    # surface: klint's walker takes tsx?/jsx?/mts/cts alone (core/runner.ts), so
    # SKILL.md and the templates are invisible to it and are held by
    # test/shipped-invocations.test.ts instead. builtin-tools.ts is excluded
    # because its comment documents the old form this rule exists to retire.
    - pattern: 're:(bun|node) ~/\.pal/(tools|skills)/'
      in:
        - "assets/**"
        - "src/**"
        - "!src/cli/builtin-tools.ts"
      message: "Tool invoked through a tilde path — no Windows shell expands it. Use 'pal cli <tool>' or 'pal cli skill run <skill> <tool>'."

    # "~" is a shell feature: bash and zsh expand it before a process starts,
    # cmd.exe has no such feature, and PowerShell hands it to native commands
    # literally. So node:path has nothing for it and every hand-rolled expander
    # is a Windows bug waiting — the one this replaced was context.ts's
    # unanchored file.replace("~", home), which turned /tmp/a~b/c into
    # /tmp/a<home>b/c. toPath() in paths.ts is the only expander.
    - pattern: 're:(startsWith\(.~|replace\(.~|replace\(/\^~)'
      in:
        - "src/**"
        - "!src/hooks/lib/paths.ts"
      message: "Hand-rolled tilde expansion — import toPath() from src/hooks/lib/paths.ts, which anchors on the leading segment and rejects ~user."

    # A path that came from argv or a flag has not been through a shell on
    # Windows, so resolve() reads its leading "~" as a literal directory under
    # the cwd. toPath() is resolve() plus the expansion the shell did not do.
    - pattern: 're:resolve\((values\.|argv\[|positionals\[|args\[|rest\b)'
      in:
        - "src/**"
      message: "Foreign path string resolved directly — use toPath() from src/hooks/lib/paths.ts so a leading tilde survives Windows."

    # The page's libraries belong to the @pal/control-room-ui workspace and are
    # bundled into ui/dist, so they are absent from what a PAL user installs.
    # Bun hoists them into the root node_modules for local development, which
    # means resolution alone would not stop server code importing them — this
    # rule is the boundary.
    - pattern: 're:from "(react|react-dom|react-router|radix-ui|clsx|tailwind-merge|class-variance-authority)'
      in:
        - "src/**"
        - "!src/tools/control-room/ui/**"
      message: "Page-only dependency imported outside the control-room-ui workspace — it is not installed for PAL users, so this would fail at runtime."

    # RtkWrap's run() is the spawn seam itself — it forwards stdin to `rtk hook`
    # and its stdout back, and what is left after removing the spawn is nothing a
    # test would assert. Extracting it would move the seam, not shrink it.
    - pattern: 're:^(?:async )?function '
      in:
        - "src/hooks/*.ts"
        - "!src/hooks/handlers/**"
        - "!src/hooks/lib/**"
        - "!src/hooks/RtkWrap.ts"
      message: "Unexported function in a hook entrypoint — nothing can import it, so nothing can test it. Move it to src/hooks/lib/."

  singleton:
    - pattern: "process.env.PAL_HOME"
      only: "src/hooks/lib/paths.ts"
      in: ["src/**"]
      message: "PAL home path accessed directly — use the paths module (src/hooks/lib/paths.ts) instead."

    - pattern: "process.env.PAL_ANTHROPIC_API_KEY"
      only: "src/hooks/lib/inference.ts"
      in: ["src/hooks/**", "src/tools/**"]
      message: "Direct access to PAL_ANTHROPIC_API_KEY bypasses the inference layer — use the inference module instead."

    - pattern: "process.env.PAL_PKG"
      only: "src/hooks/lib/paths.ts"
      in: ["src/**"]
      message: "Package root path accessed directly — use getPalPkg() from the paths module instead."

    - pattern: "resolve(import.meta.dir"
      only: "src/hooks/lib/paths.ts"
      in: ["src/hooks/lib/**"]
      message: "Package-relative path resolution in hook lib must go through the paths module — import getPalPkg() instead of navigating from import.meta.dir."

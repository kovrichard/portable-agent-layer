# yaml-language-server: $schema=https://raw.githubusercontent.com/konvert7/klint/refs/heads/main/klint.schema.json

# The suite's own rules, kept apart from ../klint.yaml so the product rules and
# the sonar plugin do not start judging test code. Paths are relative to test/.
include:
  - "."
rules: {}

arch:
  singleton:
    - pattern: 're:\brmSync\('
      only: "lib/remove-once-released.ts"
      message: "Delete through removeOnceReleased() from test/lib/remove-once-released.ts — a child the test started can still hold the folder, and Windows refuses to delete it (EBUSY)."

    - pattern: 're:\bsymlinkSync\('
      only: "lib/links.ts"
      message: "Link through linkDir() or linkFile() from test/lib/links.ts — a plain directory symlink needs Developer Mode on Windows and throws EPERM everywhere else."

    - pattern: 're:\.\./\.test\b'
      only: "lib/test-home.ts"
      message: "Build test homes with testHome() or freshTestDir() from test/lib/test-home.ts, so every one lives under .test/<suite>/."

    - pattern: 're:\b(mkdtempSync|tmpdir)\('
      only: "lib/test-home.ts"
      message: "Build test folders with testHome() or freshTestDir() from test/lib/test-home.ts — a random temp dir piles up once nothing tears it down. Code that walks up to a project root gets outsideRepoHome()."

  forbidden:
    - pattern: 're:\b(afterEach|afterAll)\b'
      in: ["."]
      message: "Tests only set up, never tear down: undo the previous test's state at the start of beforeEach instead."
